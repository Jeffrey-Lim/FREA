[project]
name = "frea"
version = "1.0.0"
authors = []
description = "FREA: Feasibility-Guided Generation of Safety-Critical Scenarios with Reasonable Adversariality"
readme = "README.md"
requires-python = "==3.7"
dependencies = [
    "beartype>=0.14.1",
    "distance3d>=0.9.0",
    "einops>=0.6.1",
    "gym==0.23.1",
    "h5py>=3.8.0",
    "importlib-metadata>=6.7.0",
    "joblib>=1.3.2",
    "matplotlib>=3.5.3",
    "moviepy==1.0.3",
    "numpy>=1.21.6",
    "opencv-python>=4.10.0.84",
    "pandas>=1.3.5",
    "pillow>=9.5.0",
    "pygame>=2.6.1",
    "pytorch-lightning>=1.9.5",
    "pyyaml>=6.0.1",
    "rdp>=0.8",
    "scikit-image>=0.19.3",
    "scipy>=1.7.3",
    "seaborn>=0.12.2",
    "setuptools>=68.0.0",
    "shapely>=2.0.6",
    "six>=1.17.0",
    "tqdm>=4.67.1",
    "torchmetrics>=0.11.4",
    "torch==1.13.1+cu117",
    "transformers>=4.30.2",
    "safetensors==0.3.1",
    "tensorboard>=2.11.2",
]

[project.urls]
Homepage = "https://currychen77.github.io/FREA/"
Repository = "https://github.com/CurryChen77/FREA.git"
Issues = "https://github.com/CurryChen77/FREA/issues"

[tool.rye]
managed = true
lock-with-sources = true
virtual = false
universal = true

[[tool.rye.sources]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu117/torch/"
type = "find-links"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
